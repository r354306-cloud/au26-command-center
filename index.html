<title>AU26 Command Center</title>
<style>
:root{--bg:#f7f5f1;--surface:#fff;--ink:#221d19;--muted:#6f675e;--line:#e4ddd3;--accent:#ba0c2f;--aink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#18191b;--surface:#222327;--ink:#ece8e1;--muted:#a29b91;--line:#37383d;--accent:#f24d68;--aink:#1c0b10}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 28px;max-width:360px;width:100%;
box-shadow:0 6px 24px -10px rgba(0,0,0,.25);text-align:center}
h1{font-size:1.25rem;margin:0 0 4px}
p{color:var(--muted);font-size:.85rem;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
font:inherit;background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.03em}
button{margin-top:12px;width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:var(--aink);
font:600 .95rem system-ui,sans-serif;cursor:pointer}
.err{color:var(--accent);font-size:.8rem;min-height:1.2em;margin-top:10px}
</style>
</head>

<input type="password" id="p" placeholder="passphrase" autocomplete="current-password" autofocus>
<button type="submit">Unlock</button>
<div class="err" id="e"></div>
</form>

function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function unlock(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  var e=document.getElementById("e");
  try{
    var html=await unlock(pw);
    try{sessionStorage.setItem("au26-pass",pw);}catch(_){}
    document.open();document.write(html);document.close();
  }catch(err){
    if(!silent) e.textContent="Wrong passphrase. Try again.";
    try{sessionStorage.removeItem("au26-pass");}catch(_){}
  }
}
document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();go(document.getElementById("p").value,false);});
try{var c=sessionStorage.getItem("au26-pass");if(c)go(c,true);}catch(_){}
